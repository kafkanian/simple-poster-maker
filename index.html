<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하이퍼 캔버스 포스터 스튜디오</title>
    
    <style>
        /* 💡 안정성이 검증된 구글 한글 폰트 라인업 */
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Gamja+Flower&family=Poor+Story&family=Cute+Font&family=Yeon+Sung&family=East+Sea+Dokdo&family=Gowun+Batang:wght@700&family=Nanum+Gothic:wght@800&family=Noto+Sans+KR:wght@900&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f5f6fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1250px;
            width: 100%;
            display: flex;
            gap: 25px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .control-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 85vh;
            overflow-y: auto;
            padding-right: 15px;
        }
        .preview-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: #edf2f7;
            border-radius: 12px;
            padding: 20px;
        }
        h2 { margin-top: 0; color: #2d3748; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }
        h3 { margin: 5px 0; font-size: 14px; color: #3182ce; font-weight: bold; }
        .section-box {
            background: #f7fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 8px;
        }
        .row-group { display: flex; gap: 10px; }
        .row-group .input-group { flex: 1; }
        label { font-weight: bold; color: #4a5568; font-size: 13px; }
        input, textarea, select {
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }
        input[type="range"] { padding: 0; cursor: pointer; }
        input[type="color"] { padding: 2px; height: 40px; cursor: pointer; width: 100%; }
        
        .file-upload-btn, .action-btn {
            padding: 10px;
            background-color: #ebf8ff;
            border: 2px dashed #63b3ed;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #2b6cb0;
            margin-top: 5px;
            display: block;
            user-select: none;
        }
        .action-btn {
            background-color: #e2e8f0;
            border: 1px solid #cbd5e0;
            color: #4a5568;
        }
        .action-btn:hover { background-color: #cbd5e0; }
        
        .sticker-preset-btn {
            padding: 8px;
            font-size: 22px;
            background: white;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sticker-preset-btn:hover { transform: scale(1.1); background: #f7fafc; }

        .main-btn {
            padding: 15px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
            width: 100%;
        }
        .main-btn:hover { background-color: #27ae60; }
        
        canvas {
            max-width: 100%;
            max-height: 580px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background-color: #fff;
        }
        .delete-btn {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .delete-btn:hover { background-color: #c53030; }
    </style>
</head>
<body>

<div class="container">
    <div class="control-panel">
        <h2>🎨 무제한 캔버스 스튜디오</h2>
        
        <div class="section-box">
            <h3>🖼️ 1. 배경 설정</h3>
            <div class="input-group">
                <label>사진 배경 고르기 (12가지 테마)</label>
                <select id="theme" onchange="handleThemeChange()">
                    <option value="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=800&q=80">🎉 파티 / 대축제</option>
                    <option value="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=800&q=80">🛍️ 프리마켓 / 세일</option>
                    <option value="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800&q=80">☕ 카페 / 먹거리</option>
                    <option value="https://images.unsplash.com/photo-1557683316-973673baf926?w=800&q=80">🎨 그라데이션 예술</option>
                    <option value="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&q=80">🏖️ 시원한 여름 바다</option>
                    <option value="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80">🌳 초록초록 자연 환경</option>
                    <option value="https://images.unsplash.com/photo-1531685222403-f928502d2b60?w=800&q=80">📻 레트로 / 옛날 감성</option>
                    <option value="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=800&q=80">🚀 신비한 과학 우주</option>
                    <option value="https://images.unsplash.com/photo-1508739773434-c26b3d09e071?w=800&q=80">🧱 깔끔한 벽돌 배경</option>
                    <option value="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=800&q=80">✨ 반짝반짝 네온 클럽</option>
                    <option value="https://images.unsplash.com/photo-1544816155-12df9643f363?w=800&q=80">🎄 따뜻한 크리스마스</option>
                    <option value="https://images.unsplash.com/photo-1508349679140-346a14c02ba9?w=800&q=80">🎃 으스스 할로윈 파티</option>
                    <option value="custom">[내 이미지 직접 업로드 ↑]</option>
                </select>
                <label for="imageLoader" class="file-upload-btn" id="uploadBtnLabel" style="display:none;">📁 배경 사진 선택</label>
                <input type="file" id="imageLoader" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">
            </div>
            
            <div class="input-group" style="margin-top: 12px; border-top: 1px dashed #cbd5e0; padding-top: 10px;">
                <label>🎨 배경을 단색으로 채우기</label>
                <div style="display: flex; gap: 10px; align-items: center; margin-top: 4px;">
                    <input type="color" id="bgColorPicker" value="#ffffff" onchange="handleBgColorChange(this.value)" style="flex: 0.4; height: 38px;">
                    <span style="font-size: 12px; color: #718096;">색상을 고르면 단색 배경으로 바뀝니다!</span>
                </div>
            </div>

            <div class="input-group" id="filterGroup" style="margin-top: 8px;">
                <label for="overlayOpacity">배경 어둡기 필터</label>
                <input type="range" id="overlayOpacity" min="0" max="0.9" step="0.05" value="0.3" oninput="updatePoster()">
            </div>
        </div>

        <div class="section-box">
            <h3>➕ 요소 추가하기</h3>
            <div class="row-group">
                <button class="action-btn" style="flex:1;" onclick="addTextLayer()">🔤 글자 추가</button>
                <label for="stickerLoader" class="action-btn" style="flex:1; margin-top:5px;">📷 컴퓨터 사진 추가</label>
                <input type="file" id="stickerLoader" accept="image/*" style="display:none;" onchange="handleStickerUpload(event)">
            </div>
            
            <div class="input-group" style="margin-top: 10px;">
                <label>⭐ 귀여운 스티커 쏙 넣기 (12가지 종류)</label>
                <div class="row-group" style="flex-wrap: wrap; gap: 6px; margin-top: 4px;">
                    <button class="sticker-preset-btn" onclick="addEmojiSticker('❤️')">❤️</button>
                    <button class="sticker-preset-btn" onclick="addEmojiSticker('✨')">✨</button>
                    <button class="sticker-preset-btn" onclick="addEmojiSticker('🎉')">🎉</button>
                    <button class="sticker-preset-btn" onclick="addEmojiSticker('☕')">☕</button>
                    <button class="sticker-preset-btn" onclick="addEmojiSticker('🛍️')">🛍️</button>
                    <button class="sticker-preset-btn" onclick="addEmojiSticker('🔥')">🔥</button>
                    <button class="sticker-preset-btn" onclick="addEmojiSticker('📢')">📢</button>
                    <button class="sticker-preset-btn" onclick="addEmojiSticker('🥇')">🥇</button>
                    <button class="sticker-preset-btn" onclick="addEmojiSticker('💡')">💡</button>
                    <button class="sticker-preset-btn" onclick="addEmojiSticker('🍀')">🍀</button>
                    <button class="sticker-preset-btn" onclick="addEmojiSticker('🐱')">🐱</button>
                    <button class="sticker-preset-btn" onclick="addEmojiSticker('🍏')">🍏</button>
                </div>
            </div>

            <div class="input-group" style="margin-top: 8px;">
                <label>🔷 기본 도형 넣기</label>
                <div class="row-group" style="gap: 6px; margin-top: 4px;">
                    <button class="action-btn" style="flex:1; font-size:12px; padding:6px;" onclick="addShapeLayer('circle')">🟡 동그라미</button>
                    <button class="action-btn" style="flex:1; font-size:12px; padding:6px;" onclick="addShapeLayer('rect')">🟦 네모</button>
                    <button class="action-btn" style="flex:1; font-size:12px; padding:6px;" onclick="addShapeLayer('bubble')">💬 말풍선</button>
                </div>
            </div>
        </div>

        <div class="section-box" id="propertyEditor" style="display:none;">
            <h3 id="propTitle">📝 선택한 요소 편집</h3>
            
            <div class="row-group" style="margin-bottom: 12px; border-bottom: 1px dashed #cbd5e0; padding-bottom: 10px;">
                <button class="action-btn" style="flex:1; background:#fff;" onclick="moveLayerOrder('forward')">🔼 맨 앞으로 보내기</button>
                <button class="action-btn" style="flex:1; background:#fff;" onclick="moveLayerOrder('backward')">🔽 맨 뒤로 보내기</button>
            </div>
            
            <div id="textOptions" style="display:none;">
                <div class="input-group">
                    <label>문구 내용</label>
                    <textarea id="propTextContent" rows="3" oninput="onPropertyChange()"></textarea>
                </div>
                <div class="input-group">
                    <label>폰트 스타일 (11가지 서체)</label>
                    <select id="propTextFont" onchange="onPropertyChange()">
                        <option value="Black Han Sans">배민 한나체 (두껍고 강력함)</option>
                        <option value="Do Hyeon">배민 도현체 (네모네모 꽉참)</option>
                        <option value="Jua">배민 주아체 (둥글둥글 귀여움)</option>
                        <option value="Gamja Flower">감자꽃체 (아기자기 동화책)</option>
                        <option value="Poor Story">푸른밤 푸어스토리 (정감있는 손글씨)</option>
                        <option value="Cute Font">큐트폰트 (동글동글 아기자기)</option>
                        <option value="Yeon Sung">연성체 (전통적인 붓글씨)</option>
                        <option value="East Sea Dokdo">독도체 (거친 개성파 글씨)</option>
                        <option value="Gowun Batang">고운바탕 (단정하고 우아함)</option>
                        <option value="Nanum Gothic">나눔고딕 (꽉 찬 고딕 강조형)</option>
                        <option value="Noto Sans KR">본고딕 (가장 기본적이고 깔끔)</option>
                    </select>
                </div>
                <div class="row-group">
                    <div class="input-group"><label>크기</label><input type="number" id="propTextSize" oninput="onPropertyChange()"></div>
                    <div class="input-group" style="flex:0.6;"><label>색상</label><input type="color" id="propTextColor" onchange="onPropertyChange()"></div>
                </div>
                <div class="row-group" style="margin-top:8px; background:#edf2f7; padding:8px; border-radius:6px; align-items:center;">
                    <div style="display:flex; align-items:center; gap:4px; flex:1;">
                        <input type="checkbox" id="propTextStroke" onchange="onPropertyChange()" style="cursor:pointer;">
                        <label for="propTextStroke" style="cursor:pointer;">글자 테두리 켜기</label>
                    </div>
                    <div style="display:flex; align-items:center; gap:4px; flex:0.8;">
                        <label style="font-size:11px;">선 색</label>
                        <input type="color" id="propTextStrokeColor" value="#000000" onchange="onPropertyChange()" style="height:30px;">
                    </div>
                </div>
            </div>

            <div id="imageOptions" style="display:none;">
                <div class="input-group" id="shapeColorGroup" style="display:none;">
                    <label>도형 채우기 색상</label>
                    <input type="color" id="propShapeColor" value="#ffcc00" onchange="onPropertyChange()">
                </div>
                <span style="font-size:12px; color:#718096;">선택한 요소는 마우스 모서리 점을 드래그하여 크기를 바꿀 수 있습니다.</span>
            </div>

            <div class="input-group" style="margin-top:10px; border-top:1px solid #e2e8f0; padding-top:10px;">
                <label>💫 회전 제어</label>
                <div class="row-group" style="align-items:center;">
                    <input type="range" id="propRotation" min="0" max="359" step="1" value="0" style="flex:1;" oninput="onRotationSliderChange(this.value)">
                    <input type="number" id="propRotationNumber" min="0" max="359" step="1" value="0" style="flex:0.3; padding:5px; text-align:center;" oninput="onRotationSliderChange(this.value)">
                    <span style="font-size:12px; font-weight:bold; color:#4a5568;">°</span>
                </div>
            </div>

            <button class="delete-btn" style="width:100%;" onclick="deleteSelectedLayer()">선택 요소 삭제 ❌</button>
        </div>
    </div>

    <div class="preview-panel">
        <div style="font-size:12px; font-weight: bold; color: #2b6cb0; margin-bottom: 15px; align-self: flex-start; background: #ebf8ff; padding: 6px 12px; border-radius: 6px; width: 97%;">
            💡 초등 꿀팁: 글자를 <span style="color:#e53e3e;">두 번 빠르게 톡톡(더블클릭)</span> 누르면 글자 내용을 바로 바꿀 수 있어요!
        </div>
        <canvas id="posterCanvas" width="800" height="1200"></canvas>
        <button class="main-btn" onclick="downloadPoster()">포스터 완성 및 다운로드 💾</button>
    </div>
</div>

<script>
    let currentBgImg = new Image();
    let useColorBg = false;      
    let bgColorValue = '#ffffff'; 
    let layers = [];         
    let selectedLayer = null; 
    
    let isDragging = false;
    let isResizing = false;       
    let isRotating = false; 

    let dragOffsetX = 0, dragOffsetY = 0;
    let initialScaleOrSize = 1.0;       
    let initialAngle = 0; 
    let startMouseAngle = 0;

    const HANDLE_SIZE = 16;       
    const ROTATE_HANDLE_OFFSET = 40; 

    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');

    window.onload = function() {
        loadBgImage(document.getElementById('theme').value);
        layers.push({ id: 1, type: 'text', text: '여름맞이 대축제', x: 400, y: 300, size: 75, font: "Black Han Sans", color: '#FFFFFF', angle: 0, useStroke: true, strokeColor: '#000000' });
        layers.push({ id: 2, type: 'text', text: '시원한 음료 1+1 이벤트\n지금 매장으로 방문하세요!', x: 400, y: 950, size: 38, font: "Noto Sans KR", color: '#FFD700', angle: 0, useStroke: true, strokeColor: '#000000' });
        initCanvasEvents(); 
        
        // 💡 [핵심 버그 해결] 구글 웹폰트가 웹 브라우저 메모리에 완벽히 들어왔을 때 캔버스를 갱신해주는 시스템
        if (document.fonts) {
            document.fonts.ready.then(function() {
                updatePoster();
            });
        } else {
            setTimeout(updatePoster, 400);
        }
    };

    function handleThemeChange() {
        useColorBg = false; 
        document.getElementById('filterGroup').style.display = 'flex'; 
        
        const themeSelect = document.getElementById('theme');
        const uploadLabel = document.getElementById('uploadBtnLabel');
        if (themeSelect.value === 'custom') {
            uploadLabel.style.display = 'block';
        } else {
            uploadLabel.style.display = 'none';
            loadBgImage(themeSelect.value);
        }
    }

    function handleBgColorChange(color) {
        useColorBg = true; 
        bgColorValue = color;
        document.getElementById('filterGroup').style.display = 'none'; 
        updatePoster();
    }

    function loadBgImage(url) {
        currentBgImg = new Image();
        if(url.startsWith('http')) currentBgImg.crossOrigin = "Anonymous";
        currentBgImg.src = url;
        currentBgImg.onload = updatePoster;
    }

    function handleFileUpload(e) {
        useColorBg = false;
        document.getElementById('filterGroup').style.display = 'flex';
        const reader = new FileReader();
        reader.onload = function(event) {
            currentBgImg = new Image();
            currentBgImg.src = event.target.result;
            currentBgImg.onload = updatePoster;
        }
        reader.readAsDataURL(e.target.files[0]);
    }

    function addTextLayer() {
        const newText = {
            id: Date.now(),
            type: 'text',
            text: '새로운 홍보 문구',
            x: 400, y: 600, size: 45,
            font: "Noto Sans KR",
            color: '#FFFFFF', angle: 0,
            useStroke: true, strokeColor: '#000000'
        };
        layers.push(newText);
        selectedLayer = newText;
        showPropertyEditor();
        updatePoster();
    }

    function addEmojiSticker(emoji) {
        const newEmoji = {
            id: Date.now(),
            type: 'text',
            text: emoji,
            x: 400, y: 600, size: 100,
            font: "Noto Sans KR",
            color: '#FFFFFF', angle: 0,
            useStroke: false, strokeColor: '#000000'
        };
        layers.push(newEmoji);
        selectedLayer = newEmoji;
        showPropertyEditor();
        updatePoster();
    }

    function addShapeLayer(shapeType) {
        const newShape = {
            id: Date.now(),
            type: 'shape',
            shape: shapeType,
            x: 400, y: 600,
            scale: 1.0,
            width: shapeType === 'rect' ? 200 : 150,
            height: 150,
            color: '#ffcc00',
            angle: 0
        };
        layers.push(newShape);
        selectedLayer = newShape;
        showPropertyEditor();
        updatePoster();
    }

    function handleStickerUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function() {
                const newImg = {
                    id: Date.now(),
                    type: 'image', img: img,
                    x: 400, y: 600, scale: 0.5, 
                    width: img.width, height: img.height, angle: 0
                };
                layers.push(newImg);
                selectedLayer = newImg;
                showPropertyEditor();
                updatePoster();
            };
        }
        reader.readAsDataURL(file);
        e.target.value = ''; 
    }

    function showPropertyEditor() {
        const editor = document.getElementById('propertyEditor');
        const textOpts = document.getElementById('textOptions');
        const imgOpts = document.getElementById('imageOptions');
        const shapeColorGroup = document.getElementById('shapeColorGroup');
        
        if (!selectedLayer) {
            editor.style.display = 'none';
            return;
        }
        
        editor.style.display = 'block';
        document.getElementById('propRotation').value = selectedLayer.angle;
        document.getElementById('propRotationNumber').value = selectedLayer.angle;

        if (selectedLayer.type === 'text') {
            textOpts.style.display = 'block';
            imgOpts.style.display = 'none';
            document.getElementById('propTitle').innerText = '🔤 글자 속성 편집';
            document.getElementById('propTextContent').value = selectedLayer.text;
            document.getElementById('propTextFont').value = selectedLayer.font;
            document.getElementById('propTextSize').value = selectedLayer.size;
            document.getElementById('propTextColor').value = selectedLayer.color;
            document.getElementById('propTextStroke').checked = selectedLayer.useStroke || false;
            document.getElementById('propTextStrokeColor').value = selectedLayer.strokeColor || '#000000';
        } else {
            textOpts.style.display = 'none';
            imgOpts.style.display = 'block';
            if(selectedLayer.type === 'shape') {
                document.getElementById('propTitle').innerText = '🔷 도형 속성 편집';
                shapeColorGroup.style.display = 'block';
                document.getElementById('propShapeColor').value = selectedLayer.color;
            } else {
                document.getElementById('propTitle').innerText = '🖼️ 사진 속성 편집';
                shapeColorGroup.style.display = 'none';
            }
        }
    }

    function onPropertyChange() {
        if (!selectedLayer) return;
        if (selectedLayer.type === 'text') {
            selectedLayer.text = document.getElementById('propTextContent').value;
            selectedLayer.font = document.getElementById('propTextFont').value;
            selectedLayer.size = parseInt(document.getElementById('propTextSize').value) || 20;
            selectedLayer.color = document.getElementById('propTextColor').value;
            selectedLayer.useStroke = document.getElementById('propTextStroke').checked;
            selectedLayer.strokeColor = document.getElementById('propTextStrokeColor').value;
        } else if (selectedLayer.type === 'shape') {
            selectedLayer.color = document.getElementById('propShapeColor').value;
        }
        
        // 💡 사용자가 폰트나 속성을 바꿀 때 강제로 화면을 재배치하고 가동시킵니다.
        forceFontReloadAndDraw();
    }

    // 💡 폰트가 즉시 반영되도록 강제 지연 업데이트 함수 추가
    function forceFontReloadAndDraw() {
        updatePoster();
        setTimeout(updatePoster, 50); 
    }

    function onRotationSliderChange(val) {
        if (!selectedLayer) return;
        let angle = parseInt(val) || 0;
        angle = (angle % 360 + 360) % 360;
        selectedLayer.angle = angle;
        document.getElementById('propRotation').value = angle;
        document.getElementById('propRotationNumber').value = angle;
        updatePoster();
    }

    function moveLayerOrder(direction) {
        if (!selectedLayer) return;
        const index = layers.findIndex(l => l.id === selectedLayer.id);
        if (index === -1) return;

        if (direction === 'forward') {
            layers.splice(index, 1);
            layers.push(selectedLayer);
        } else if (direction === 'backward') {
            layers.splice(index, 1);
            layers.unshift(selectedLayer);
        }
        updatePoster();
    }

    function deleteSelectedLayer() {
        if (!selectedLayer) return;
        layers = layers.filter(l => l.id !== selectedLayer.id);
        selectedLayer = null;
        showPropertyEditor();
        updatePoster();
    }

    /* --- 마우스 인터랙션 엔진 --- */

    function initCanvasEvents() {
        canvas.addEventListener('mousedown', onStart);
        canvas.addEventListener('mousemove', onMove);
        canvas.addEventListener('mouseup', onEnd);
        canvas.addEventListener('mouseleave', onEnd);
        canvas.addEventListener('dblclick', onDoubleClick);

        canvas.addEventListener('touchstart', onStart, { passive: false });
        canvas.addEventListener('touchmove', onMove, { passive: false });
        canvas.addEventListener('touchend', onEnd);
    }

    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function getLayerLocalBounds(layer) {
        if (layer.type === 'image' || layer.type === 'shape') {
            const w = layer.width * layer.scale;
            const h = layer.height * layer.scale;
            return { x1: -w/2, x2: w/2, y1: -h/2, y2: h/2, w: w, h: h };
        } else {
            ctx.save();
            ctx.font = `bold ${layer.size}px "${layer.font}", sans-serif`;
            const lines = layer.text.split('\n');
            let maxW = 0;
            lines.forEach(l => { maxW = Math.max(maxW, ctx.measureText(l).width); });
            const h = lines.length * layer.size * 1.25;
            ctx.restore();
            return { x1: -maxW/2, x2: maxW/2, y1: -layer.size, y2: h - layer.size, w: maxW, h: h };
        }
    }

    function toLocalCoords(worldX, worldY, centerX, centerY, angleDegrees) {
        const rad = -angleDegrees * Math.PI / 180;
        const dx = worldX - centerX;
        const dy = worldY - centerY;
        return {
            x: dx * Math.cos(rad) - dy * Math.sin(rad),
            y: dx * Math.sin(rad) + dy * Math.cos(rad)
        };
    }

    function onDoubleClick(e) {
        const mouse = getCanvasCoords(e);
        
        for (let i = layers.length - 1; i >= 0; i--) {
            const layer = layers[i];
            if (layer.type !== 'text') continue; 
            
            const localB = getLayerLocalBounds(layer);
            const localMouse = toLocalCoords(mouse.x, mouse.y, layer.x, layer.y, layer.angle);

            if (localMouse.x >= localB.x1 && localMouse.x <= localB.x2 && 
                localMouse.y >= localB.y1 && localMouse.y <= localB.y2) {
                
                selectedLayer = layer;
                showPropertyEditor();

                const newText = prompt("✏️ 글자 내용을 멋지게 수정해 보세요!\n(줄바꿈 상태를 그대로 유지하려면 칸을 잘 맞춰서 입력해 주시면 좋습니다.)", layer.text);
                
                if (newText !== null) { 
                    layer.text = newText;
                    document.getElementById('propTextContent').value = newText; 
                    forceFontReloadAndDraw();
                }
                break;
            }
        }
    }

    function onStart(e) {
        if(e.touches) e.preventDefault();
        const mouse = getCanvasCoords(e);

        if (selectedLayer) {
            const localB = getLayerLocalBounds(selectedLayer);
            const localMouse = toLocalCoords(mouse.x, mouse.y, selectedLayer.x, selectedLayer.y, selectedLayer.angle);

            const rotX = 0;
            const rotY = localB.y1 - ROTATE_HANDLE_OFFSET;
            if (Math.hypot(localMouse.x - rotX, localMouse.y - rotY) <= HANDLE_SIZE) {
                isRotating = true;
                initialAngle = selectedLayer.angle;
                startMouseAngle = Math.atan2(mouse.y - selectedLayer.y, mouse.x - selectedLayer.x) * 180 / Math.PI;
                return;
            }

            if (Math.hypot(localMouse.x - localB.x2, localMouse.y - localB.y2) <= HANDLE_SIZE) {
                isResizing = true;
                dragOffsetX = localMouse.x;
                initialScaleOrSize = selectedLayer.type === 'image' || selectedLayer.type === 'shape' ? selectedLayer.scale : selectedLayer.size;
                return;
            }
        }

        let hit = false;
        for (let i = layers.length - 1; i >= 0; i--) {
            const layer = layers[i];
            const localB = getLayerLocalBounds(layer);
            const localMouse = toLocalCoords(mouse.x, mouse.y, layer.x, layer.y, layer.angle);

            if (localMouse.x >= localB.x1 && localMouse.x <= localB.x2 && 
                localMouse.y >= localB.y1 && localMouse.y <= localB.y2) {
                selectedLayer = layer;
                isDragging = true;
                dragOffsetX = localMouse.x;
                dragOffsetY = localMouse.y;
                hit = true;
                break;
            }
        }

        if (!hit && !isResizing && !isRotating) selectedLayer = null;
        showPropertyEditor();
        updatePoster();
    }

    function onMove(e) {
        if(e.touches) e.preventDefault();
        const mouse = getCanvasCoords(e);

        if (!isDragging && !isResizing && !isRotating && selectedLayer) {
            const localB = getLayerLocalBounds(selectedLayer);
            const localMouse = toLocalCoords(mouse.x, mouse.y, selectedLayer.x, selectedLayer.y, selectedLayer.angle);
            
            if (Math.hypot(localMouse.x - 0, localMouse.y - (localB.y1 - ROTATE_HANDLE_OFFSET)) <= HANDLE_SIZE) {
                canvas.style.cursor = 'crosshair';
            } else if (Math.hypot(localMouse.x - localB.x2, localMouse.y - localB.y2) <= HANDLE_SIZE) {
                canvas.style.cursor = 'se-resize';
            } else if (localMouse.x >= localB.x1 && localMouse.x <= localB.x2 && localMouse.y >= localB.y1 && localMouse.y <= localB.y2) {
                canvas.style.cursor = 'move';
            } else {
                canvas.style.cursor = 'default';
            }
        }

        if (isRotating && selectedLayer) {
            const currentMouseAngle = Math.atan2(mouse.y - selectedLayer.y, mouse.x - selectedLayer.x) * 180 / Math.PI;
            const deltaAngle = currentMouseAngle - startMouseAngle;
            let newAngle = Math.round(initialAngle + deltaAngle);
            newAngle = (newAngle % 360 + 360) % 360;
            selectedLayer.angle = newAngle;
            document.getElementById('propRotation').value = newAngle;
            document.getElementById('propRotationNumber').value = newAngle;
            updatePoster();
        } 
        else if (isResizing && selectedLayer) {
            const localMouse = toLocalCoords(mouse.x, mouse.y, selectedLayer.x, selectedLayer.y, selectedLayer.angle);
            const ratio = localMouse.x / dragOffsetX;
            
            if (selectedLayer.type === 'image' || selectedLayer.type === 'shape') {
                selectedLayer.scale = Math.max(0.05, Math.min(2.5, initialScaleOrSize * ratio));
            } else {
                selectedLayer.size = Math.max(12, Math.min(150, Math.round(initialScaleOrSize * ratio)));
                document.getElementById('propTextSize').value = selectedLayer.size;
            }
            updatePoster();
        } 
        else if (isDragging && selectedLayer) {
            const rad = selectedLayer.angle * Math.PI / 180;
            const worldOffsetX = dragOffsetX * Math.cos(rad) - dragOffsetY * Math.sin(rad);
            const worldOffsetY = dragOffsetX * Math.sin(rad) + dragOffsetY * Math.cos(rad);
            
            selectedLayer.x = mouse.x - worldOffsetX;
            selectedLayer.y = mouse.y - worldOffsetY;
            updatePoster();
        }
    }

    function onEnd() { 
        isDragging = false; 
        isResizing = false; 
        isRotating = false; 
        canvas.style.cursor = 'default'; 
    }

    /* --- 그래픽 최종 렌더링 엔진 --- */

    function updatePoster() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (useColorBg) {
            ctx.fillStyle = bgColorValue;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
            if (!currentBgImg.src) return;
            const opacity = document.getElementById('overlayOpacity').value;
            ctx.drawImage(currentBgImg, 0, 0, canvas.width, canvas.height);
            ctx.fillStyle = `rgba(0, 0, 0, ${opacity})`; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        layers.forEach(layer => {
            ctx.save();
            
            ctx.translate(layer.x, layer.y);
            ctx.rotate(layer.angle * Math.PI / 180);
            
            ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
            ctx.shadowBlur = layer.type === 'shape' ? 5 : 10;

            if (layer.type === 'image') {
                const w = layer.width * layer.scale;
                const h = layer.height * layer.scale;
                ctx.drawImage(layer.img, -w/2, -h/2, w, h);
            } 
            else if (layer.type === 'shape') {
                ctx.fillStyle = layer.color;
                const w = layer.width * layer.scale;
                const h = layer.height * layer.scale;
                
                if(layer.shape === 'rect') {
                    ctx.fillRect(-w/2, -h/2, w, h);
                } else if(layer.shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(0, 0, w/2, 0, Math.PI * 2);
                    ctx.fill();
                } else if(layer.shape === 'bubble') {
                    ctx.beginPath();
                    ctx.roundRect(-w/2, -h/2, w, h * 0.8, 15);
                    ctx.moveTo(-15, h*0.3);
                    ctx.lineTo(0, h*0.5);
                    ctx.lineTo(15, h*0.3);
                    ctx.fill();
                }
            }
            else {
                ctx.textAlign = "center";
                ctx.fillStyle = layer.color;
                
                // 💡 따옴표 구조를 고쳐 Canvas 브라우저 엔진이 정확한 다운로드 폰트명을 인식하게 빌드
                ctx.font = `bold ${layer.size}px "${layer.font}", sans-serif`;
                
                if(layer.useStroke) {
                    ctx.strokeStyle = layer.strokeColor || '#000000';
                    ctx.lineWidth = Math.max(2, layer.size * 0.12); 
                    ctx.lineJoin = 'round';
                }

                const lines = layer.text.split('\n');
                lines.forEach((line, index) => {
                    const yPos = (index * layer.size * 1.25);
                    if(layer.useStroke) {
                        ctx.strokeText(line, 0, yPos);
                    }
                    ctx.fillText(line, 0, yPos);
                });
            }

            if (selectedLayer && selectedLayer.id === layer.id) {
                const localB = getLayerLocalBounds(layer);
                
                ctx.shadowBlur = 0; 
                ctx.strokeStyle = '#3182ce';
                ctx.lineWidth = 3;
                ctx.strokeRect(localB.x1, localB.y1, localB.w, localB.h);
                
                ctx.fillStyle = '#3182ce';
                ctx.beginPath();
                ctx.arc(localB.x2, localB.y2, HANDLE_SIZE/2, 0, Math.PI * 2);
                ctx.fill();

                const rotX = 0;
                const rotY = localB.y1 - ROTATE_HANDLE_OFFSET;
                
                ctx.strokeStyle = '#2ecc71';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, localB.y1);
                ctx.lineTo(rotX, rotY);
                ctx.stroke();

                ctx.fillStyle = '#2ecc71';
                ctx.beginPath();
                ctx.arc(rotX, rotY, HANDLE_SIZE/2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        });
    }

    function downloadPoster() {
        const prevSelected = selectedLayer;
        selectedLayer = null; 
        updatePoster();
        
        setTimeout(() => {
            const link = document.createElement('a');
            link.download = 'canvas-poster-fixed.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            selectedLayer = prevSelected;
            updatePoster();
        }, 50);
    }
</script>
</body>
